<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saved Countries - Guitaria</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* Additional styles for saved items page */
      .saved-container {
        min-height: 100vh;
        padding: 100px 40px 40px;
        background:
          linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)),
          url("https://images.unsplash.com/photo-1511379938547-c1f69419868d")
            center/cover fixed;
      }

      .saved-card {
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(12px);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        padding: 40px;
        color: white;
        max-width: 1200px;
        margin: 0 auto;
      }

      .saved-header {
        text-align: center;
        margin-bottom: 30px;
      }

      .saved-header h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
      }

      .saved-header h1 i {
        color: #f4b400;
      }

      .saved-header p {
        color: #ccc;
        font-size: 1.1rem;
      }

      .saved-stats {
        background: rgba(244, 180, 0, 0.2);
        padding: 15px 25px;
        border-radius: 30px;
        display: inline-block;
        margin: 20px auto;
        border: 1px solid rgba(244, 180, 0, 0.3);
      }

      .saved-stats i {
        color: #f4b400;
        margin-right: 8px;
      }

      .saved-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
        margin-top: 30px;
      }

      .saved-item-card {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 20px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        transition: all 0.3s;
        display: flex;
        flex-direction: column;
        gap: 10px;
        position: relative;
      }

      .saved-item-card:hover {
        transform: translateY(-5px);
        border-color: #f4b400;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      }

      .saved-country-name {
        font-size: 1.2rem;
        font-weight: bold;
        color: #f4b400;
        margin-bottom: 5px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding-right: 40px;
      }

      .saved-flag {
        font-size: 2rem;
      }

      .saved-info {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #ccc;
        font-size: 0.95rem;
        margin: 5px 0;
      }

      .saved-info i {
        width: 20px;
        color: #f4b400;
      }

      .saved-date {
        font-size: 0.8rem;
        color: #999;
        margin-top: 10px;
        font-style: italic;
      }

      .remove-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(244, 67, 54, 0.2);
        color: #f44336;
        border: 1px solid rgba(244, 67, 54, 0.3);
        border-radius: 50%;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s;
      }

      .remove-btn:hover {
        background: rgba(244, 67, 54, 0.8);
        color: white;
        transform: scale(1.1);
      }

      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #ccc;
      }

      .empty-state i {
        font-size: 5rem;
        color: #f4b400;
        margin-bottom: 20px;
        opacity: 0.5;
      }

      .empty-state h2 {
        font-size: 2rem;
        margin-bottom: 10px;
        color: white;
      }

      .empty-state p {
        margin-bottom: 20px;
      }

      .empty-state .browse-btn {
        display: inline-block;
        padding: 12px 30px;
        background: #f4b400;
        color: #000;
        text-decoration: none;
        border-radius: 25px;
        font-weight: bold;
        transition: all 0.3s;
      }

      .empty-state .browse-btn:hover {
        background: #e2a200;
        transform: translateY(-2px);
      }

      .clear-all-btn {
        background: rgba(244, 67, 54, 0.2);
        color: #f44336;
        border: 1px solid rgba(244, 67, 54, 0.3);
        padding: 10px 20px;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.3s;
        margin-left: 15px;
      }

      .clear-all-btn:hover {
        background: rgba(244, 67, 54, 0.8);
        color: white;
      }

      .action-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        margin: 20px 0;
        flex-wrap: wrap;
      }
    </style>
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="admin.html" class="admin-link">Admin</a></li>
        <li><a href="api.html" class="api-link">API</a></li>
        <li><a href="saved-items.html" class="saved-link">Saved Items</a></li>
        <li><a href="login.html" class="signup">Logout</a></li>
      </ul>
    </nav>

    <!-- Saved Items Container -->
    <div class="saved-container">
      <div class="saved-card">
        <div class="saved-header">
          <h1>
            <i class="fas fa-bookmark"></i>
            Saved Countries
          </h1>
          <p>Your collection of saved countries from around the world</p>
        </div>

        <!-- Stats and Actions -->
        <div class="action-buttons">
          <div id="savedStats" class="saved-stats">
            <i class="fas fa-globe"></i>
            <span id="savedCount">0</span> countries saved
          </div>
          <button id="clearAllBtn" class="clear-all-btn">
            <i class="fas fa-trash-alt"></i> Clear All
          </button>
        </div>

        <!-- Saved Items Grid -->
        <div id="savedGrid" class="saved-grid">
          <!-- Items will be inserted here by JavaScript -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state" style="display: none">
          <i class="fas fa-bookmark"></i>
          <h2>No saved countries yet</h2>
          <p>Browse countries and save your favorites to see them here!</p>
          <a href="api.html" class="browse-btn">
            <i class="fas fa-search"></i> Browse Countries
          </a>
        </div>
      </div>
    </div>

    <script>
      // Load and display saved countries
      function loadSavedCountries() {
        const savedGrid = document.getElementById("savedGrid");
        const emptyState = document.getElementById("emptyState");
        const savedCount = document.getElementById("savedCount");

        // Get saved countries from localStorage
        let savedCountries = [];
        try {
          savedCountries =
            JSON.parse(localStorage.getItem("savedCountries")) || [];
        } catch (e) {
          savedCountries = [];
        }

        // Update count
        savedCount.textContent = savedCountries.length;

        // Show/hide empty state
        if (savedCountries.length === 0) {
          savedGrid.innerHTML = "";
          emptyState.style.display = "block";
          return;
        }

        emptyState.style.display = "none";
        savedGrid.innerHTML = "";

        // Create a copy for display sorting (keep original for removal)
        const displayCountries = [...savedCountries].sort(
          (a, b) => new Date(b.savedAt) - new Date(a.savedAt),
        );

        // Display each saved country
        displayCountries.forEach((country) => {
          const card = document.createElement("div");
          card.className = "saved-item-card";

          // Format date
          const savedDate = new Date(country.savedAt);
          const dateStr = savedDate.toLocaleDateString("en-US", {
            year: "numeric",
            month: "long",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit",
          });

          // Escape quotes for the onclick parameter
          const countryName = country.name.replace(/'/g, "\\'");

          card.innerHTML = `
        <div class="saved-country-name">
          <span class="saved-flag">${country.flag || "🏳️"}</span>
          ${country.name}
        </div>
        <button class="remove-btn" onclick="removeSavedCountry('${countryName}')" title="Remove from saved">
          <i class="fas fa-times"></i>
        </button>
        <div class="saved-info">
          <i class="fas fa-map-marker-alt"></i>
          Capital: ${country.capital || "No capital"}
        </div>
        <div class="saved-info">
          <i class="fas fa-users"></i>
          Population: ${country.population || "Unknown"}
        </div>
        <div class="saved-info">
          <i class="fas fa-globe"></i>
          Region: ${country.region || "Unknown"}
        </div>
        <div class="saved-info">
          <i class="fas fa-globe-asia"></i>
          Subregion: ${country.subregion || "Not specified"}
        </div>
        <div class="saved-info">
          <i class="fas fa-money-bill-wave"></i>
          Currency: ${country.currency || "No data"}
        </div>
        <div class="saved-info">
          <i class="fas fa-language"></i>
          Languages: ${country.languages || "No data"}
        </div>
        <div class="saved-date">
          <i class="far fa-calendar-alt"></i> Saved on: ${dateStr}
        </div>
      `;

          savedGrid.appendChild(card);
        });
      }

      // Remove a saved country by name (unique identifier)
      window.removeSavedCountry = function (countryName) {
        let savedCountries =
          JSON.parse(localStorage.getItem("savedCountries")) || [];

        // Find the index of the country with matching name
        const index = savedCountries.findIndex((c) => c.name === countryName);

        if (index !== -1) {
          const removed = savedCountries[index];
          savedCountries.splice(index, 1);
          localStorage.setItem(
            "savedCountries",
            JSON.stringify(savedCountries),
          );

          // Show message
          showNotification(`Removed ${removed.name} from saved`);

          // Reload display
          loadSavedCountries();
        }
      };

      // Clear all saved countries
      document.addEventListener("DOMContentLoaded", function () {
        const clearAllBtn = document.getElementById("clearAllBtn");

        if (clearAllBtn) {
          clearAllBtn.addEventListener("click", function () {
            if (
              confirm("Are you sure you want to remove all saved countries?")
            ) {
              localStorage.removeItem("savedCountries");
              showNotification("All saved countries removed");
              loadSavedCountries();
            }
          });
        }

        // Load saved countries on page load
        loadSavedCountries();
      });

      // Show notification
      function showNotification(message) {
        const msgDiv = document.createElement("div");
        msgDiv.className = "save-message";
        msgDiv.style.background = "#2196f3";
        msgDiv.innerHTML = `
      <i class="fas fa-info-circle"></i>
      ${message}
    `;

        document.body.appendChild(msgDiv);

        setTimeout(() => {
          msgDiv.remove();
        }, 3000);
      }
    </script>
  </body>
</html>
