<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <ul class="nav-links" id="settingsNav">
        <!-- Navbar will be populated by JavaScript -->
      </ul>
    </nav>

    <!-- Settings Container -->
    <div class="settings-container">
      <div class="settings-card">
        <h2><i class="fas fa-cog settings-icon"></i>Settings</h2>

        <!-- Settings Form (visual only) -->
        <form>
          <label for="email">Change Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter new email"
            disabled
          />

          <label for="address">Change Address</label>
          <input
            type="text"
            id="address"
            placeholder="Enter new address"
            disabled
          />

          <label for="password">Change Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter new password"
            disabled
          />

          <label for="theme">Theme Option</label>
          <select id="theme">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>

          <button type="button" class="save-btn">Save Changes</button>
        </form>
      </div>
    </div>

    <script>
      function buildNavbar() {
        const navLinks = document.getElementById("settingsNav");
        const userRole = localStorage.getItem("userRole");
        const isLoggedIn = localStorage.getItem("profileName");

        if (!isLoggedIn) {
          window.location.href = "login.html";
          return;
        }

        let links = `
          <li><a href="index.html">Home</a></li>
          <li><a href="profile.html">Profile</a></li>
        `;

        if (userRole === "admin") {
          links += `<li><a href="admin.html" class="admin-link">Admin</a></li>`;
        }

        links += `
          <li><a href="api.html" class="api-link">API</a></li>
          <li><a href="saved-items.html" class="saved-link">Saved Items</a></li>
          <li><a href="login.html" class="signup">Logout</a></li>
        `;

        navLinks.innerHTML = links;

        const logoutLink = document.querySelector(
          '.nav-links a[href="login.html"].signup',
        );
        if (logoutLink) {
          logoutLink.addEventListener("click", function (e) {
            e.preventDefault();
            localStorage.removeItem("profileName");
            localStorage.removeItem("profileEmail");
            localStorage.removeItem("userRole");
            window.location.href = "login.html";
          });
        }
      }

      document.addEventListener("DOMContentLoaded", function () {
        buildNavbar();

        const saveBtn = document.querySelector(".save-btn");
        const themeSelect = document.getElementById("theme");

        const savedTheme = localStorage.getItem("theme");
        if (savedTheme) {
          themeSelect.value = savedTheme;
          document.body.className = savedTheme + "-theme";
        }

        saveBtn.addEventListener("click", function () {
          const selectedTheme = themeSelect.value;
          localStorage.setItem("theme", selectedTheme);
          alert("Settings saved!");
        });
      });
    </script>
  </body>
</html>
