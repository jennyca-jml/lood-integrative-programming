<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body>
    <!-- Navbar - Dynamic based on user role -->
    <nav class="navbar">
      <ul class="nav-links" id="dynamicNav">
        <!-- Navbar will be populated by JavaScript -->
      </ul>
    </nav>

    <!-- Profile Section -->
    <div class="profile-container">
      <!-- Profile Card -->
      <div class="profile-card">
        <img
          src="https://i.pravatar.cc/150?img=12"
          alt="Profile Avatar"
          class="profile-avatar"
        />

        <h1 id="profileName">Loading...</h1>
        <p class="profile-email" id="profileEmail">Loading...</p>
        <p class="profile-address">Alegria, Cebu, Philippines</p>
      </div>

      <!-- Info Section -->
      <div class="profile-info-box">
        <h1>About Me</h1>
        <p>
          I am a guitar enthusiast learning fingerstyle and acoustic techniques.
          Guitaria helps me practice, improve, and stay inspired on my music
          journey.
        </p>
      </div>
    </div>

    <script>
      // Function to build navbar based on user role
      function buildNavbar() {
        const navLinks = document.getElementById("dynamicNav");
        const userRole = localStorage.getItem("userRole");
        const isLoggedIn = localStorage.getItem("profileName");

        if (!isLoggedIn) {
          // Not logged in - redirect to login
          window.location.href = "login.html";
          return;
        }

        // Start with Home and Profile links
        let links = `
          <li><a href="index.html">Home</a></li>
          <li><a href="profile.html">Profile</a></li>
        `;

        // Add Admin link if user is admin
        if (userRole === "admin") {
          links += `<li><a href="admin.html" class="admin-link">Admin</a></li>`;
        }

        // Add remaining links
        links += `
          <li><a href="api.html" class="api-link">API</a></li>
          <li><a href="saved-items.html" class="saved-link">Saved Items</a></li>
          <li><a href="login.html" class="signup">Logout</a></li>
        `;

        navLinks.innerHTML = links;

        // Add logout handler
        const logoutLink = document.querySelector(
          '.nav-links a[href="login.html"].signup',
        );
        if (logoutLink) {
          logoutLink.addEventListener("click", function (e) {
            e.preventDefault();
            localStorage.removeItem("profileName");
            localStorage.removeItem("profileEmail");
            localStorage.removeItem("userRole");
            window.location.href = "login.html";
          });
        }
      }

      // Load profile data
      document.addEventListener("DOMContentLoaded", function () {
        buildNavbar();

        const nameField = document.getElementById("profileName");
        const emailField = document.getElementById("profileEmail");

        const storedName = localStorage.getItem("profileName");
        const storedEmail = localStorage.getItem("profileEmail");

        if (storedName) nameField.textContent = storedName;
        if (storedEmail) emailField.textContent = storedEmail;

        console.log(
          "Profile loaded - User:",
          storedName,
          "Role:",
          localStorage.getItem("userRole"),
        );
      });
    </script>
  </body>
</html>
