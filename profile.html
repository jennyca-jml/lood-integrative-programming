<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="settings.html">Settings</a></li>
        <li><a href="login.html" class="signup">Logout</a></li>
      </ul>
    </nav>

    <!-- Profile Section -->
    <div class="profile-container">
      <!-- Profile Card -->
      <div class="profile-card">
        <img
          src="https://i.pravatar.cc/150?img=12"
          alt="Profile Avatar"
          class="profile-avatar"
        />

        <h1>Riguel Jameson Alleje</h1>
        <p class="profile-email">riguelalleje@gmail.com</p>
        <p class="profile-address">Alegria, Cebu, Philippines</p>
      </div>

      <!-- Info Section -->
      <div class="profile-info-box">
        <h1>About Me</h1>
        <p>
          I am a guitar enthusiast learning fingerstyle and acoustic techniques.
          Guitaria helps me practice, improve, and stay inspired on my music
          journey.
        </p>
      </div>
    </div>

    <script>
      // Wait for DOM to load
      document.addEventListener("DOMContentLoaded", function () {
        const nameField = document.querySelector(".profile-card h1");
        const emailField = document.querySelector(".profile-email");

        // Get info from localStorage
        const storedName = localStorage.getItem("profileName");
        const storedEmail = localStorage.getItem("profileEmail");

        // Update the profile page
        if (storedName) nameField.textContent = storedName;
        if (storedEmail) emailField.textContent = storedEmail;
      });
      // Add logout functionality
      document
        .querySelector('.nav-links a[href="login.html"]')
        .addEventListener("click", function (e) {
          e.preventDefault();
          // Clear any session data if needed
          window.location.href = "login.html";
        });
    </script>
    <script>
      // Existing profile code...

      // Check if user is admin and show admin link in navbar
      document.addEventListener("DOMContentLoaded", function () {
        const userRole = localStorage.getItem("userRole");
        const navLinks = document.querySelector(".nav-links");

        if (userRole === "admin") {
          // Add admin link if not exists
          if (!document.querySelector(".admin-link")) {
            const adminLi = document.createElement("li");
            adminLi.innerHTML =
              '<a href="admin.html" class="admin-link">Admin</a>';
            navLinks.insertBefore(adminLi, navLinks.children[1]); // Insert after Home
          }
        }
      });
    </script>
  </body>
</html>
